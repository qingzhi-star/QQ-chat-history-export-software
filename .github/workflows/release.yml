name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: py${{ matrix.python-version }} / windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Privacy audit
        run: python tools/check_privacy.py --audit

  build:
    name: build + GitHub Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist + wheel
        run: |
          python -m pip install "build>=1"
          python -m build
      - name: Verify wheel contents
        run: python tools/check_wheel.py dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @assets --generate-notes --title "qqexport $env:GITHUB_REF_NAME"
