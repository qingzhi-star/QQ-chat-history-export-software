name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python tools/check_privacy.py --audit
  desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - name: Verify source and release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/release_electron.py --check-source --tag $env:GITHUB_REF_NAME
      - run: npm.cmd --prefix desktop ci --no-fund
      - run: npm.cmd --prefix desktop test
      - run: npm.cmd --prefix desktop run test:ui
      - name: Verify native Electron PDF
        shell: pwsh
        run: |
          $env:QILU_ELECTRON_RUNTIME = node -p "require('./desktop/node_modules/electron')"
          python -c "import os; from pathlib import Path; from tools.verify_electron_core import verify; print(verify(Path(os.environ['QILU_ELECTRON_RUNTIME']), Path(os.environ['RUNNER_TEMP'])/'qilu-pdf-check'))"
      # Release assets are built and accepted on Windows 11, then published from
      # that exact manifest. CI must not replace them with an unaccepted rebuild.
